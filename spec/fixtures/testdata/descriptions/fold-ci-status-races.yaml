name: fold-ci-status-races
description: >
  Concurrent ci-status ops for the same [revision, name] key and for distinct
  names (keyed-lww per key). A later write under one key leaves other keys
  untouched. Also covers WRIT-198's third collision: approval (keyed on
  [subject, revision]) and ci-status (keyed on [revision, name]) shared one
  target, "revision", with no distinct target of their own. An approval whose
  (subject, revision) and a ci-status whose (revision, name) are the same flat
  tuple in the opposite order — approval subject "a@b.c" / revision "deadbeef",
  ci-status revision "a@b.c" / name "deadbeef" — used to land in the same
  keyed-lww register, so whichever wrote later silently overwrote the other's
  value. ci-status.revision now targets "ci_revision", so the two stay in
  separate state keys and neither can touch the other. Three values here are
  non-conforming for their declared value_type, not two: approval's revision
  "deadbeef" and ci-status's revision "a@b.c" are not conforming git-oid
  values (40 or 64 hex characters), and approval's subject "a@b.c" is not a
  conforming person-ref either — it has no "scheme:value" prefix (see
  spec/identifiers.md). person-ref is the one value_type of the three that
  normalizes on the read path, which makes it the value most worth naming
  explicitly. Op bodies are not schema-validated on the read/fold path, so a
  non-conforming writer can emit all three, and this is the only pairing
  that crosses the two keyed-lww key tuples with the same flat values in
  opposite key positions.

refs:
  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: r-ci
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "CI Status Races Review"
            expect: accept

          - id: alice-ci-pending
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: r-ci
              object_type: review
              op_type: ci-status
              op_version: 1
              body:
                revision: "1111111111111111111111111111111111111111"
                name: "ci/test"
                state: "pending"
                url: "https://ci.example.com/builds/101"
                description: "Running unit tests"
                started_at: "2026-01-01T00:01:00Z"
                external_id: "101"
            expect: accept

          - id: alice-ci-success
            parents: [alice-ci-pending]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: r-ci
              object_type: review
              op_type: ci-status
              op_version: 1
              body:
                revision: "1111111111111111111111111111111111111111"
                name: "ci/test"
                state: "success"
                url: "https://ci.example.com/builds/101-retry"
                description: "All unit tests passed"
                started_at: "2026-01-01T00:02:30Z"
                completed_at: "2026-01-01T00:02:55Z"
                external_id: "103"
            expect: accept

          - id: alice-approval-crossing
            parents: [alice-ci-success]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: r-ci
              object_type: review
              op_type: approval
              op_version: 1
              body:
                subject: "a@b.c"
                revision: "deadbeef"
                verdict: "approve"
            expect: accept

          - id: alice-ci-crossing
            parents: [alice-approval-crossing]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: r-ci
              object_type: review
              op_type: ci-status
              op_version: 1
              body:
                revision: "a@b.c"
                name: "deadbeef"
                state: "success"
            expect: accept

  - name: refs/writ/fedcba9876543210/review
    history:
      - commits:
          - id: bob-ci-lint
            parents: [alice-create]
            author: bob
            timestamp: 2026-01-01T00:01:30Z
            op:
              object_id: r-ci
              object_type: review
              op_type: ci-status
              op_version: 1
              body:
                revision: "1111111111111111111111111111111111111111"
                name: "ci/lint"
                state: "success"
                url: "https://ci.example.com/builds/lint-1"
                description: "Lint checks clean"
                started_at: "2026-01-01T00:01:00Z"
                completed_at: "2026-01-01T00:01:25Z"
                external_id: "102"
            expect: accept

          - id: bob-ci-test-failure
            parents: [bob-ci-lint]
            author: bob
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: r-ci
              object_type: review
              op_type: ci-status
              op_version: 1
              body:
                revision: "1111111111111111111111111111111111111111"
                name: "ci/test"
                state: "failure"
                url: "https://ci.example.com/builds/101"
                description: "1 test failed"
                started_at: "2026-01-01T00:01:00Z"
                completed_at: "2026-01-01T00:01:50Z"
                external_id: "101"
            expect: accept
