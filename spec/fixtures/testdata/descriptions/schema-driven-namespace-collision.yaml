name: schema-driven-namespace-collision
description: >
  WRIT-254 change 2: neither alice's nor bob's schema object carries the
  derived id "schema:shared-namespace" their shared namespace requires
  (spec/identifiers.md's schema carve-out) -- both are independently
  minted, "sch-alice" and "sch-bob". A conforming write path never
  produces this: it is what a non-conforming producer, or a hand-crafted
  commit, can still put in the log. Before WRIT-254 this was the
  "mostly cosmetic" namespace collision (spec/schema-ops.md's old §6 kind
  2): both objects installed and neither type was withheld. That
  conflict kind is gone now, not weakened -- resolveSchemaTypes drops a
  schema object whose own object_id disagrees with "schema:" + its
  namespace before any of its types are even looked at, so BOTH objects
  here are dropped wholesale: two conflicts, one per object, neither
  naming widget-a or widget-b specifically. Nothing installs for either
  type, and both widget-a's and widget-b's ops fall through the
  absent-schema path to UnknownOp, exactly as if no schema had ever
  declared them -- the inverse of this fixture's pre-WRIT-254 point.
  (pins: reader)

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: sch-alice
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "shared-namespace"
            expect: accept

          - id: alice-define-type
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: sch-alice
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "shared-namespace.widget-a"
            expect: accept

          - id: alice-define-field
            parents: [alice-define-type]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: sch-alice
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "shared-namespace.widget-a"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

  - name: refs/writ/fedcba9876543210/schema
    history:
      - commits:
          - id: bob-create
            author: bob
            timestamp: 2026-01-01T00:00:30Z
            op:
              object_id: sch-bob
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "shared-namespace"
            expect: accept

          - id: bob-define-type
            parents: [bob-create]
            author: bob
            timestamp: 2026-01-01T00:01:30Z
            op:
              object_id: sch-bob
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "shared-namespace.widget-b"
            expect: accept

          - id: bob-define-field
            parents: [bob-define-type]
            author: bob
            timestamp: 2026-01-01T00:02:30Z
            op:
              object_id: sch-bob
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "shared-namespace.widget-b"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

  - name: refs/writ/0123456789abcdef/widget-a
    history:
      - commits:
          - id: widget-a-create
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: widget-a-1
              object_type: shared-namespace.widget-a
              op_type: create
              op_version: 1
              body:
                title: "Widget A"
            expect: accept

  - name: refs/writ/fedcba9876543210/widget-b
    history:
      - commits:
          - id: widget-b-create
            author: bob
            timestamp: 2026-01-01T00:03:30Z
            op:
              object_id: widget-b-1
              object_type: shared-namespace.widget-b
              op_type: create
              op_version: 1
              body:
                title: "Widget B"
            expect: accept
