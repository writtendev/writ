name: schema-driven-version-bump-distinct-target
description: >
  Correction 3's remedy, at the resolver level (spec/testdata/fold/merge/
  schema-version-bump-new-target.json pins the fold half of this; this
  fixture pins the resolver half, which that vector structurally cannot
  express because it drives the generic Fold over already-resolved
  FieldRules, not RulesFromSchemas). op_version 1 of "configure" declares
  field "mode" as lww; op_version 2 redeclares "mode" as set-union under a
  distinct target "mode_v2" (spec/schema-ops.md §8). RulesFromSchemas
  installs both rules: old ops keep folding under v1's rules, new ops fold
  under v2's, and neither is a conflict. (pins: reader)

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept

          - id: define-type
            parents: [create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "gadget"
            expect: accept

          - id: define-field-v1
            parents: [define-type]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "gadget"
                op_type: "configure"
                op_version: "1"
                field: "mode"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: define-field-v2
            parents: [define-field-v1]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "gadget"
                op_type: "configure"
                op_version: "2"
                field: "mode"
                value_type: "string"
                strategy: "set-union"
                target: "mode_v2"
            expect: accept

  - name: refs/writ/0123456789abcdef/gadget
    history:
      - commits:
          - id: configure-v1
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: gadget-1
              object_type: gadget
              op_type: configure
              op_version: 1
              body:
                mode: "legacy-status"
            expect: accept

          - id: configure-v2
            parents: [configure-v1]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: gadget-1
              object_type: gadget
              op_type: configure
              op_version: 2
              body:
                mode: ["tag-a", "tag-b"]
            expect: accept
