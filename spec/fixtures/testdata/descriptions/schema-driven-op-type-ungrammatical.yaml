name: schema-driven-op-type-ungrammatical
description: >
  spec/schema-ops.md §6 kind op-type-ungrammatical is normative -- every
  v0.1 reader must report it -- but until this fixture no schema-driven
  golden ever reached it, so a resolver regression that stopped emitting it
  (or reported the dropped rule as rule-invalid instead) could pass every
  other fixture in the corpus. Nothing on the fold path checks a schema
  op's declared op_type against the envelope grammar before
  writ.RulesFromSchemas's own gate (validOpTypeGrammar, engine/schema.go):
  both ops below decode and fold into schema state exactly as written
  (expect: accept), and only the resolver drops them.

  One schema object, namespace "acme", declares "acme.gadget" with a
  control field (title, under the well-formed op_type "create") alongside
  a second field, "status", declared under op_type "Set-Status" -- an
  uppercase first character, which the op_type grammar
  (^[a-z][a-z0-9-]*$, spec/op-envelope.md) refuses. It also declares a
  define-op entry under the well-formed op_type "review" alongside a
  second declared under "Approve", the same violation. Both hostile
  op_types are dropped and reported as kind op-type-ungrammatical
  (spec/schema-ops.md §6); neither ever reaches spec.ValidateFieldRule, so
  neither is reported as rule-invalid. Because an ungrammatical op_type
  can never be written as a real op's own envelope op_type either (that
  value is checked by the ordinary envelope grammar on every op, hostile
  declaration or not), there is no UnknownOp-shaped object to fold
  alongside acme.gadget's -- only the two declarations themselves
  demonstrate the drop. acme.gadget's own "create" op folds normally,
  unaffected by either hostile declaration. (pins: reader)

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept

          - id: define-type
            parents: [create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "acme.gadget"
            expect: accept

          - id: define-field-title
            parents: [define-type]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: define-field-bad-op-type
            parents: [define-field-title]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "Set-Status"
                op_version: "1"
                field: "status"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: define-op-review
            parents: [define-field-bad-op-type]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-op
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "review"
                op_version: "1"
                description: "Review the gadget"
            expect: accept

          - id: define-op-bad-op-type
            parents: [define-op-review]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-op
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "Approve"
                op_version: "1"
                description: "Approve the gadget"
            expect: accept

  - name: refs/writ/0123456789abcdef/gadget
    history:
      - commits:
          - id: gadget-create
            author: alice
            timestamp: 2026-01-01T00:06:00Z
            op:
              object_id: gadget-1
              object_type: acme.gadget
              op_type: create
              op_version: 1
              body:
                title: "Widget"
            expect: accept
