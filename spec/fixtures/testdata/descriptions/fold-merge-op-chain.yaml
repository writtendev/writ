name: fold-merge-op-chain
description: >
  A merge operation chain linking concurrent branches (WRIT-369).
  Format-reserved merge ops (op_type: "merge", op_version: 1, body: {})
  carry no field writes across any object type and must not be reported
  in unknown_ops, while maintaining causal ancestry in the restricted DAG.

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: schema-create
            author: alice
            timestamp: 2025-12-01T00:00:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept

          - id: schema-define-type
            parents: [schema-create]
            author: alice
            timestamp: 2025-12-01T00:01:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "acme.widget"
            expect: accept

          - id: schema-define-create-title
            parents: [schema-define-type]
            author: alice
            timestamp: 2025-12-01T00:02:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: schema-define-update-title
            parents: [schema-define-create-title]
            author: alice
            timestamp: 2025-12-01T00:03:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "update"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: schema-define-update-tags
            parents: [schema-define-update-title]
            author: alice
            timestamp: 2025-12-01T00:04:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "update"
                op_version: "1"
                field: "tags"
                value_type: "string"
                strategy: "set-union"
            expect: accept

  - name: refs/writ/0123456789abcdef/widget
    history:
      - commits:
          - id: widget-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: w-merge-chain
              object_type: acme.widget
              op_type: create
              op_version: 1
              body:
                title: "Initial Title"
            expect: accept

          - id: widget-branch-a
            parents: [widget-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: w-merge-chain
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Title A"
                tags: ["tag-a"]
            expect: accept

          - id: widget-branch-b
            parents: [widget-create]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: w-merge-chain
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Title B"
                tags: ["tag-b"]
            expect: accept

          - id: widget-merge-link
            parents: [widget-branch-a, widget-branch-b]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: w-merge-chain
              object_type: acme.widget
              op_type: merge
              op_version: 1
              body: {}
            expect: accept

          - id: widget-final
            parents: [widget-merge-link]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: w-merge-chain
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Final Title"
                tags: ["tag-c"]
            expect: accept
