name: envelope-valid-ops
description: >
  Valid op envelopes across alice and bob writer refs: root op (no parents),
  chain successor, cross-writer causal DAG edge, unicode payload, large integer
  carried as string, unknown top-level field, unknown object_type/op_type,
  empty body, op_version at 1 and 2^53-1, and object_id at 1 and 256 characters.

refs:
  - name: refs/writ/alice/widget
    history:
      - commits:
          - id: alice-root
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: widget-01
              object_type: acme.widget
              op_type: create
              op_version: 1
              body:
                title: "Initial widget"
            expect: accept
          - id: alice-update-1
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: widget-01
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Updated widget"
                summary: "日本語 • 🚀 • \u0000"
            expect: accept
          - id: alice-unknown
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: x
              object_type: acme.custom-object
              op_type: custom-op
              op_version: 1
              body:
                note: "forward compatibility"
              custom_top_level_field: "preserved-and-ignored"
            expect: accept
          - id: alice-max-id
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
              object_type: acme.widget
              op_type: publish
              op_version: 1
              body:
                status: "published"
            expect: accept

  - name: refs/writ/bob/widget
    history:
      - commits:
          - id: bob-root
            author: bob
            timestamp: 2026-01-01T00:00:30Z
            op:
              object_id: widget-02
              object_type: acme.widget
              op_type: create
              op_version: 1
              body: {}
            expect: accept
          - id: bob-cross-alice
            parents: [bob-root, alice-update-1]
            author: bob
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: widget-01
              object_type: acme.gadget
              op_type: create
              op_version: 9007199254740991
              body:
                note: "looks good"
                large_int: "9007199254740992837482910384729"
            expect: accept
