name: schema-driven-cross-op-type-lattice-collision
description: >
  WRIT-198 round 3's finding: the widened target-collision standard
  (spec/fold.md §5, spec/schema-ops.md §8) must also hold `lattice`
  rules to agreement, because `lattice` — unlike `value_type`, `key`,
  `key_types`, `enum` and `max_length` — is consulted by the strategy at
  fold time (`newLatticeAccumulator` builds its rank map from it). Two
  different op_types, "promote" and "demote", both declare field "level"
  with no explicit target, so both default to target "level"
  (spec.FieldRule.TargetKey). Both use strategy lattice — the check
  before this fix compared only Strategy, value_type, key, key_types,
  enum and max_length, and would have installed both despite their
  lattice orderings disagreeing (["low","high"] vs ["high","low"]),
  making the folded state depend on which rule the resolver happened
  to resolve first: exactly the order-dependence hazard WRIT-186 named.
  WRIT-211 made the shared-target agreement relation transitive and its
  response withhold-every-rule-for-the-target rather than drop-one, so
  the resolver now withholds both "promote"'s and "demote"'s rules for
  target "level", reporting one SchemaConflict, regardless of which
  op_type happens to sort first in canonical (op_type, op_version, field)
  order; both a "promote" and a "demote" op on the ordinary object then
  match no rule and become UnknownOps. This is the fixture
  spec.CheckTargetAgreement's TestCheckTargetAgreement Go table pins at
  the function level; this fixture pins it at the log-resolved resolver
  level a schema-driven fold actually walks. (pins: reader)

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept

          - id: define-type
            parents: [create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "widget"
            expect: accept

          - id: define-field-promote
            parents: [define-type]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "widget"
                op_type: "promote"
                op_version: "1"
                field: "level"
                strategy: "lattice"
                lattice: ["low", "high"]
            expect: accept

          - id: define-field-demote
            parents: [define-field-promote]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "widget"
                op_type: "demote"
                op_version: "1"
                field: "level"
                strategy: "lattice"
                lattice: ["high", "low"]
            expect: accept

  - name: refs/writ/0123456789abcdef/widget
    history:
      - commits:
          - id: promote-1
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: widget-1
              object_type: widget
              op_type: promote
              op_version: 1
              body:
                level: "high"
            expect: accept

          - id: demote-1
            parents: [promote-1]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: widget-1
              object_type: widget
              op_type: demote
              op_version: 1
              body:
                level: "low"
            expect: accept
