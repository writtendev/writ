name: fold-ordering-fractional
description: >
  Two writers (Alice and Bob) concurrently insert items with identical fractional
  position keys ('aV') into widget w-fractional-order at the same timestamp.
  Demonstrates deterministic total ordering by effective time t* and op-id (commit SHA)
  tiebreak, with commutativity across DAG evaluation order.

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: schema-create
            author: alice
            timestamp: 2025-12-01T00:00:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept

          - id: schema-define-type
            parents: [schema-create]
            author: alice
            timestamp: 2025-12-01T00:01:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "widget"
            expect: accept

          - id: schema-define-create-title
            parents: [schema-define-type]
            author: alice
            timestamp: 2025-12-01T00:02:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "widget"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: schema-define-update-title
            parents: [schema-define-create-title]
            author: alice
            timestamp: 2025-12-01T00:03:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "widget"
                op_type: "update"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

  - name: refs/writ/0123456789abcdef/widget
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: w-fractional-order
              object_type: widget
              op_type: create
              op_version: 1
              body:
                title: "Fractional Ordering Root"
            expect: accept

          - id: alice-insert
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: w-fractional-order
              object_type: widget
              op_type: update
              op_version: 1
              body:
                title: "Alice Concurrent Insert at aV"
            expect: accept

  - name: refs/writ/fedcba9876543210/widget
    history:
      - commits:
          - id: bob-insert
            parents: [alice-create]
            author: bob
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: w-fractional-order
              object_type: widget
              op_type: update
              op_version: 1
              body:
                title: "Bob Concurrent Insert at aV"
            expect: accept
