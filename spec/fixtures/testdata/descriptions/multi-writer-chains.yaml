name: multi-writer-chains
description: >
  Two writer chains carrying interleaved ops for two object_ids (widget-01 and
  widget-02), one cross-chain causal DAG parent edge, one remote-tracking chain
  under refs/remotes/origin/writ/*, and one malformed commit missing op.json.

refs:
  - name: refs/writ/0123456789abcdef/widget
    history:
      - commits:
          - id: alice-1
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: widget-01
              object_type: widget
              op_type: create
              op_version: 1
              body:
                title: "Alice widget 1"
            expect: accept
          - id: alice-2
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: widget-02
              object_type: widget
              op_type: create
              op_version: 1
              body:
                title: "Alice widget 2"
            expect: accept
          - id: alice-malformed
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            message: "writ: create widget/w-bad\n"
            files:
              README.md: "no op.json in this commit"
            expect:
              reject: missing-op-json
          - id: alice-3
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: widget-01
              object_type: widget
              op_type: update
              op_version: 1
              body:
                title: "Alice widget 1 update"
            expect: accept

  - name: refs/writ/fedcba9876543210/widget
    history:
      - commits:
          - id: bob-1
            author: bob
            timestamp: 2026-01-01T00:00:30Z
            op:
              object_id: widget-02
              object_type: widget
              op_type: note
              op_version: 1
              body:
                text: "Bob note on widget 2"
            expect: accept
          - id: bob-2
            parents: [bob-1, alice-1]
            author: bob
            timestamp: 2026-01-01T00:02:30Z
            op:
              object_id: widget-01
              object_type: widget
              op_type: note
              op_version: 1
              body:
                text: "Bob note referencing alice 1"
            expect: accept

  - name: refs/remotes/origin/writ/550e8400e29b41d4/widget
    history:
      - commits:
          - id: remote-1
            author: alice
            timestamp: 2026-01-01T00:00:45Z
            op:
              object_id: widget-01
              object_type: widget
              op_type: endorse
              op_version: 1
              body:
                status: "endorsed"
            expect: accept
