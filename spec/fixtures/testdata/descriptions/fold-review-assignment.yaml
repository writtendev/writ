name: fold-review-assignment
description: >
  Assignment and reviewer routing operations on a code review object from
  multiple writers (Alice and Bob), exercising assign:add and assign:remove
  under set-observed-remove (add-wins OR-set) with causal and concurrent
  mutations. Also carries label:add/label:remove ops whose final set differs
  from the assignee set, so the fold can be checked for what WRIT-198 fixed:
  assign's and label's OR-sets collapsing onto one target apiece (assignees,
  labels) rather than bleeding into each other or into duplicate add/remove
  state keys — a golden where the two sets happened to end up identical
  could not tell a correct fold from that bug.

refs:
  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: r-assign
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Review Assignment Test"
            expect: accept

          - id: alice-assign-initial
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: r-assign
              object_type: review
              op_type: assign
              op_version: 1
              body:
                add: ["user:alice", "email:bob@example.com"]
            expect: accept

          - id: alice-reassign
            parents: [alice-assign-initial]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: r-assign
              object_type: review
              op_type: assign
              op_version: 1
              body:
                remove: ["email:bob@example.com"]
                add: ["user:charlie"]
            expect: accept

          - id: alice-label-initial
            parents: [alice-reassign]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: r-assign
              object_type: review
              op_type: label
              op_version: 1
              body:
                add: ["bug", "needs-review"]
            expect: accept

          - id: alice-label-update
            parents: [alice-label-initial]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: r-assign
              object_type: review
              op_type: label
              op_version: 1
              body:
                remove: ["needs-review"]
                add: ["priority/high"]
            expect: accept

  - name: refs/writ/fedcba9876543210/review
    history:
      - commits:
          - id: bob-concurrent-assign
            parents: [alice-create]
            author: bob
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: r-assign
              object_type: review
              op_type: assign
              op_version: 1
              body:
                remove: ["user:charlie"]
                add: ["user:david"]
            expect: accept
