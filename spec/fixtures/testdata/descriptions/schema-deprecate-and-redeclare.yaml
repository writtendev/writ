name: schema-deprecate-and-redeclare
description: >
  define-field, then deprecate-field, then a redeclaring define-field on the
  same (type, op_type, op_version, field) key. Pins that deprecated is
  carried as data in its own keyed-lww register (field_deprecated), never a
  filter: the declaration stays present and active throughout, the
  redeclare's later attribute values win on their own registers, and nothing
  in this version clears deprecated once set (spec/schema-ops.md §5, §8).

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept

          - id: define-field-1
            parents: [create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "widget"
                op_type: "create"
                op_version: "1"
                field: "status"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: deprecate-field
            parents: [define-field-1]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: deprecate-field
              op_version: 1
              body:
                type: "widget"
                op_type: "create"
                op_version: "1"
                field: "status"
                deprecated: true
            expect: accept

          - id: define-field-2
            parents: [deprecate-field]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "widget"
                op_type: "create"
                op_version: "1"
                field: "status"
                value_type: "string"
                max_length: 280
                strategy: "lww"
            expect: accept
