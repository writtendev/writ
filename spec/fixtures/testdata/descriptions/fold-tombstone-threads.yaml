name: fold-tombstone-threads
description: >
  Threaded gadget objects exercising the `tombstone` strategy end to end in a
  signed git repository, under a schema declared in the repository's own log:
  concurrent edits (lww), concurrent delete vs edit (deletion wins, the edit
  still folds into state), causal edit after delete (state changes, deleted
  stays true), and reply edges with immutable create fields (create-once).
  This is the only signed-fixture carrier for `op_type: delete` and the
  `tombstone` strategy, so an implementation that applies a tombstone as a
  plain `lww` bool — losing delete-wins against a concurrent edit — fails
  here rather than passing the corpus clean (spec/fold.md §5.6). g-del-target
  also carries an undelete concurrent with the delete: deletion wins, so
  `deleted` stays true even though the undelete is later in the total order —
  the assertion a plain `lww` bool cannot satisfy. Both halves of §5.6's flag
  rule are carried too: g-del-target's ops state the declared flag
  explicitly, g-reply's delete omits it and is read from the op type alone.

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: schema-create
            author: alice
            timestamp: 2025-12-01T00:00:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept

          - id: schema-define-type
            parents: [schema-create]
            author: alice
            timestamp: 2025-12-01T00:01:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "acme.gadget"
            expect: accept

          - id: schema-define-create-subject
            parents: [schema-define-type]
            author: alice
            timestamp: 2025-12-01T00:02:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "create"
                op_version: "1"
                field: "subject"
                value_type: "object-ref"
                strategy: "create-once"
            expect: accept

          - id: schema-define-create-text
            parents: [schema-define-create-subject]
            author: alice
            timestamp: 2025-12-01T00:03:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "create"
                op_version: "1"
                field: "text"
                value_type: "text"
                strategy: "lww"
            expect: accept

          - id: schema-define-create-in-reply-to
            parents: [schema-define-create-text]
            author: alice
            timestamp: 2025-12-01T00:04:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "create"
                op_version: "1"
                field: "in_reply_to"
                value_type: "object-ref"
                strategy: "create-once"
            expect: accept

          - id: schema-define-edit-text
            parents: [schema-define-create-in-reply-to]
            author: alice
            timestamp: 2025-12-01T00:05:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "edit"
                op_version: "1"
                field: "text"
                target: "text"
                value_type: "text"
                strategy: "lww"
            expect: accept

          - id: schema-define-delete-deleted
            parents: [schema-define-edit-text]
            author: alice
            timestamp: 2025-12-01T00:06:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "delete"
                op_version: "1"
                field: "deleted"
                value_type: "bool"
                strategy: "tombstone"
            expect: accept

          - id: schema-define-undelete-deleted
            parents: [schema-define-delete-deleted]
            author: alice
            timestamp: 2025-12-01T00:07:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "undelete"
                op_version: "1"
                field: "deleted"
                target: "deleted"
                value_type: "bool"
                strategy: "tombstone"
            expect: accept

  - name: refs/writ/0123456789abcdef/gadget
    history:
      - commits:
          - id: alice-groot-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: g-root
              object_type: acme.gadget
              op_type: create
              op_version: 1
              body:
                subject: "w-7f3a"
                text: "Original root note"
            expect: accept

          - id: alice-groot-edit
            parents: [alice-groot-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: g-root
              object_type: acme.gadget
              op_type: edit
              op_version: 1
              body:
                text: "Alice edited root note"
            expect: accept

          - id: alice-gdel-create
            parents: [alice-groot-edit]
            author: alice
            timestamp: 2026-01-01T00:01:10Z
            op:
              object_id: g-del-target
              object_type: acme.gadget
              op_type: create
              op_version: 1
              body:
                subject: "w-7f3a"
                text: "Target for concurrent delete"
            expect: accept

          - id: alice-gdel-edit
            parents: [alice-gdel-create]
            author: alice
            timestamp: 2026-01-01T00:01:40Z
            op:
              object_id: g-del-target
              object_type: acme.gadget
              op_type: edit
              op_version: 1
              body:
                text: "Alice concurrent edit on del target"
            expect: accept

          - id: alice-gdel-undelete
            parents: [alice-gdel-edit]
            author: alice
            timestamp: 2026-01-01T00:02:10Z
            op:
              object_id: g-del-target
              object_type: acme.gadget
              op_type: undelete
              op_version: 1
              body:
                deleted: false
            expect: accept

  - name: refs/writ/fedcba9876543210/gadget
    history:
      - commits:
          - id: bob-groot-edit
            parents: [alice-groot-create]
            author: bob
            timestamp: 2026-01-01T00:01:30Z
            op:
              object_id: g-root
              object_type: acme.gadget
              op_type: edit
              op_version: 1
              body:
                text: "Bob edited root note"
            expect: accept

          - id: bob-gdel-delete
            parents: [bob-groot-edit, alice-gdel-create]
            author: bob
            timestamp: 2026-01-01T00:01:40Z
            op:
              object_id: g-del-target
              object_type: acme.gadget
              op_type: delete
              op_version: 1
              body:
                deleted: true
            expect: accept

          - id: bob-greply-create
            parents: [bob-gdel-delete]
            author: bob
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: g-reply
              object_type: acme.gadget
              op_type: create
              op_version: 1
              body:
                subject: "w-7f3a"
                in_reply_to: "g-root"
                text: "Bob reply note"
            expect: accept

          - id: bob-greply-delete
            parents: [bob-greply-create]
            author: bob
            timestamp: 2026-01-01T00:02:30Z
            op:
              object_id: g-reply
              object_type: acme.gadget
              op_type: delete
              op_version: 1
              body: {}
            expect: accept

          - id: bob-greply-causal-edit
            parents: [bob-greply-delete]
            author: bob
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: g-reply
              object_type: acme.gadget
              op_type: edit
              op_version: 1
              body:
                text: "Bob post-delete edit"
            expect: accept
