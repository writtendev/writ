name: fold-equal-tstar-tiebreak
description: >
  Sibling ops with identical t* decided by op-id byte order, a skewed clock
  where t* lifts a child above its parent's stale timestamp, and an ancestor/descendant
  pair at equal t* ensuring topological ordering precedence over commit SHA byte order.

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: schema-create
            author: alice
            timestamp: 2025-12-01T00:00:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept

          - id: schema-define-type
            parents: [schema-create]
            author: alice
            timestamp: 2025-12-01T00:01:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "acme.widget"
            expect: accept

          - id: schema-define-create-title
            parents: [schema-define-type]
            author: alice
            timestamp: 2025-12-01T00:02:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: schema-define-update-title
            parents: [schema-define-create-title]
            author: alice
            timestamp: 2025-12-01T00:03:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "update"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: schema-define-status
            parents: [schema-define-update-title]
            author: alice
            timestamp: 2025-12-01T00:04:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "set-status"
                op_version: "1"
                field: "status"
                value_type: "enum"
                enum: ["open", "closed"]
                strategy: "lww"
            expect: accept

  - name: refs/writ/0123456789abcdef/widget
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: w-tiebreak
              object_type: acme.widget
              op_type: create
              op_version: 1
              body:
                title: "Tiebreak Root Title"
            expect: accept

          - id: alice-eq
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: w-tiebreak
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Alice Equal Timestamp"
            expect: accept

  - name: refs/writ/fedcba9876543210/widget
    history:
      - commits:
          - id: bob-eq
            parents: [alice-create]
            author: bob
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: w-tiebreak
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Bob Equal Timestamp"
            expect: accept

          - id: bob-parent
            parents: [bob-eq]
            author: bob
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: w-tiebreak
              object_type: acme.widget
              op_type: set-status
              op_version: 1
              body:
                status: "closed"
            expect: accept

          - id: bob-child-skewed
            parents: [bob-parent]
            author: bob
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: w-tiebreak
              object_type: acme.widget
              op_type: set-status
              op_version: 1
              body:
                status: "open"
            expect: accept
