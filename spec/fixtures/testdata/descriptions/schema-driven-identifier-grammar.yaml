name: schema-driven-identifier-grammar
description: >
  WRIT-203: target and every keyed-lww key column now share field's own
  identifier grammar (^[a-z][a-z0-9_]*$, max 64 chars), gated inside
  spec.ValidateFieldRule — resolveSchemaTypes's pass 1, the same per-rule
  pass an unknown strategy or a keyed-lww key/key_types mismatch already
  falls through. "title" (no target, the control), "code" (a legal
  target("identifier")), "owner" (target("bad-target") — a hyphen, legal
  in namespace/type_name/op_type_name's grammar but not field_name's), and
  "tags" (keyed-lww key(["Bad Col"]) — a space and an uppercase letter,
  also illegal) alone would not tell pass 1 apart from pass 2 or 3: each
  malformed rule there is alone in its byTarget/byKeyColumn group, so
  every assertion below would hold identically wherever the grammar check
  ran (round 2 finding 1 on WRIT-203's PR). Two more pairs close that gap,
  each putting a malformed rule in a group it would poison were the check
  ever folded into a grouping pass instead of staying in pass 1:
  "alpha"/"beta" both bind target("shared") — beta's key column
  ("Bad Col2") is the malformed part, and beta also disagrees with alpha
  on strategy (lww vs keyed-lww), so a beta that survived to pass 3 would
  take alpha down with it as a target disagreement. "gamma"/"delta" share
  op_type "set-subject" and both bind key column "subject" — delta's
  target ("bad-target2") is the malformed part, and delta also disagrees
  with gamma on that column's key_types (person-ref vs string), so a
  delta that survived to pass 2 would take gamma down with it as a
  key-column disagreement. Dropping owner's, tags's, beta's and delta's
  rules in pass 1 must not withhold any of their well-formed siblings:
  every op under "set-owner", "set-tags", "set-beta" and part of
  "set-subject"'s body therefore matches no installed rule and becomes an
  UnknownOp (or, for "set-subject", folds only gamma's half), while
  "create", "set-code", "set-alpha" and the rest of "set-subject" fold
  normally. (pins: reader)

