name: schema-driven-object-type-collision
description: >
  Two schema objects, authored by two different writers but sharing one
  namespace ("shared-vocab"), both bind the same qualified object_type
  "shared-vocab.gadget" (spec/schema-ops.md §2, §6; WRIT-217). This is the
  load-bearing collision that survives namespace qualification: no winner
  is picked, no rules install for "shared-vocab.gadget" at all, and its
  ops fall through the absent-schema path to UnknownOp exactly as if no
  schema had ever declared it — even though two schemas nominally
  describe it. Two DIFFERENT namespaces declaring the same bare type name
  no longer collide at all post-WRIT-217; this fixture pins the collision
  that remains, not the one the ticket closed. RulesFromSchemas reports
  the conflict. (pins: reader)

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: sch-alice
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "shared-vocab"
            expect: accept

          - id: alice-define-type
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: sch-alice
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "shared-vocab.gadget"
            expect: accept

          - id: alice-define-field
            parents: [alice-define-type]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: sch-alice
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "shared-vocab.gadget"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

  - name: refs/writ/fedcba9876543210/schema
    history:
      - commits:
          - id: bob-create
            author: bob
            timestamp: 2026-01-01T00:00:30Z
            op:
              object_id: sch-bob
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "shared-vocab"
            expect: accept

          - id: bob-define-type
            parents: [bob-create]
            author: bob
            timestamp: 2026-01-01T00:01:30Z
            op:
              object_id: sch-bob
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "shared-vocab.gadget"
            expect: accept

          - id: bob-define-field
            parents: [bob-define-type]
            author: bob
            timestamp: 2026-01-01T00:02:30Z
            op:
              object_id: sch-bob
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "shared-vocab.gadget"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

  - name: refs/writ/0123456789abcdef/gadget
    history:
      - commits:
          - id: gadget-create
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: gadget-1
              object_type: shared-vocab.gadget
              op_type: create
              op_version: 1
              body:
                title: "Widget"
            expect: accept
