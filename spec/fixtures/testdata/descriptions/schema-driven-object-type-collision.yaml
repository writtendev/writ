name: schema-driven-object-type-collision
description: >
  Two schema objects, authored by two different writers but sharing one
  namespace ("shared-vocab"), both bind the same qualified object_type
  "shared-vocab.gadget" (spec/schema-ops.md §2, §6; WRIT-217). Before
  WRIT-254 this was the load-bearing object_type collision that survives
  namespace qualification: no winner picked, no rules installed, ops
  falling through to UnknownOp -- with RulesFromSchemas reporting an
  "object_type ... is bound by more than one schema object" conflict.
  WRIT-254 change 2 closes it a layer earlier and changes which conflict
  fires: neither "sch-alice" nor "sch-bob" is the derived id
  "schema:shared-vocab" their shared namespace requires
  (spec/identifiers.md's schema carve-out), so resolveSchemaTypes drops
  both objects wholesale -- before their types are ever compared against
  each other -- and reports one id-mismatch conflict per object instead
  of the old single object_type-collision conflict naming both. The
  observable end state most callers care about is unchanged (no rules
  for "shared-vocab.gadget", gadget's ops still fall through to
  UnknownOp exactly as if no schema had ever declared it), but the old
  object_type-collision code path this fixture used to exercise is now
  unreachable for a namespace-qualified type -- see engine/schema.go's
  own comment on that branch and the PR description's open question for
  Matt. This fixture now asserts the drop, not the collision. (pins:
  reader)

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: sch-alice
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "shared-vocab"
            expect: accept

          - id: alice-define-type
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: sch-alice
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "shared-vocab.gadget"
            expect: accept

          - id: alice-define-field
            parents: [alice-define-type]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: sch-alice
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "shared-vocab.gadget"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

  - name: refs/writ/fedcba9876543210/schema
    history:
      - commits:
          - id: bob-create
            author: bob
            timestamp: 2026-01-01T00:00:30Z
            op:
              object_id: sch-bob
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "shared-vocab"
            expect: accept

          - id: bob-define-type
            parents: [bob-create]
            author: bob
            timestamp: 2026-01-01T00:01:30Z
            op:
              object_id: sch-bob
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "shared-vocab.gadget"
            expect: accept

          - id: bob-define-field
            parents: [bob-define-type]
            author: bob
            timestamp: 2026-01-01T00:02:30Z
            op:
              object_id: sch-bob
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "shared-vocab.gadget"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

  - name: refs/writ/0123456789abcdef/gadget
    history:
      - commits:
          - id: gadget-create
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: gadget-1
              object_type: shared-vocab.gadget
              op_type: create
              op_version: 1
              body:
                title: "Widget"
            expect: accept
