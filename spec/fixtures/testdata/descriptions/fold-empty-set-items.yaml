            timestamp: 2026-02-01T00:06:00Z
            op:
              object_id: w-sort-order
              object_type: acme.widget
              op_type: create
              op_version: 1
              body:
                title: "Sort Order Test"
                description: "Pins UTF-8 byte sort order (spec/fold.md §5.3, §8) for a set field with no value_type"
            expect: accept

          - id: alice-labels-sort-order
            parents: [alice-create-sort-order]
            author: alice
            timestamp: 2026-02-01T00:07:00Z
            op:
              object_id: w-sort-order
              object_type: acme.widget
              op_type: tag
              op_version: 1
              body:
                labels: ["gamma", "alpha", "", "", "😀"]
            expect: accept

  - name: refs/writ/fedcba9876543210/widget
    history:
      - commits:
          - id: bob-concurrent-tag
            parents: [alice-create]
            author: bob
            timestamp: 2026-02-01T00:02:30Z
            op:
              object_id: w-empty-items
              object_type: acme.widget
