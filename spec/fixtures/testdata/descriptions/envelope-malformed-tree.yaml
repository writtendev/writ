name: envelope-malformed-tree
description: >
  Negative tree and committer validation test cases: tree-shape violations
  (extra tree entry beside op.json, op.json inside a subdirectory, op.json absent
  from tree, op.json with executable file mode 100755, and op.json in a subdirectory
  beside an extra tree entry), and committer identity/timestamp diverging from author.

refs:
  - name: refs/writ/0123456789abcdef/widget
    history:
      - commits:
          - id: tree-extra-entry
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            message: "writ: create widget/r1\n"
            files:
              op.json: '{"body":{},"object_id":"r1","object_type":"acme.widget","op_type":"create","op_version":1}'
              extra.txt: "unauthorized extra file"
            expect:
              reject: tree-shape
          - id: tree-subdirectory
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            message: "writ: create widget/r1\n"
            files:
              subdir/op.json: '{"body":{},"object_id":"r1","object_type":"acme.widget","op_type":"create","op_version":1}'
            expect:
              reject: tree-shape
          - id: tree-missing-op-json
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            message: "writ: create widget/r1\n"
            files:
              README.md: "no op.json here"
            expect:
              reject: tree-shape
          - id: tree-executable-mode
            author: alice
            tamper: op-json-mode-exec
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: r1
              object_type: acme.widget
              op_type: create
              op_version: 1
              body: {}
            expect:
              reject: tree-shape
          - id: committer-mismatch
            author: alice
            committer: bob
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: r1
              object_type: acme.widget
              op_type: create
              op_version: 1
              body: {}
            expect:
              reject: committer-mismatch
          - id: tree-subdir-and-extra
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            message: "writ: create widget/r1\n"
            files:
              subdir/op.json: '{"body":{},"object_id":"r1","object_type":"acme.widget","op_type":"create","op_version":1}'
              extra.txt: "unauthorized extra file"
            expect:
              reject: tree-shape
