name: envelope-malformed-tree
description: >
  Negative tree and committer validation test cases: extra tree entry beside
  op.json, op.json inside a subdirectory, op.json absent from tree, op.json
  with executable file mode 100755, and committer identity/timestamp diverging
  from author.

refs:
  - name: refs/writ/alice/widget
    history:
      - commits:
          - id: tree-extra-entry
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            message: "writ: create widget/r1\n"
            files:
              op.json: '{"body":{},"object_id":"r1","object_type":"acme.widget","op_type":"create","op_version":1}'
              extra.txt: "unauthorized extra file"
            expect:
              reject: extra-tree-entry
          - id: tree-subdirectory
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            message: "writ: create widget/r1\n"
            files:
              subdir/op.json: '{"body":{},"object_id":"r1","object_type":"acme.widget","op_type":"create","op_version":1}'
            expect:
              reject: op-json-subdirectory
          - id: tree-missing-op-json
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            message: "writ: create widget/r1\n"
            files:
              README.md: "no op.json here"
            expect:
              reject: missing-op-json
          - id: tree-executable-mode
            author: alice
            tamper: op-json-mode-exec
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: r1
              object_type: acme.widget
              op_type: create
              op_version: 1
              body: {}
            expect:
              reject: invalid-op-json-mode
          - id: committer-mismatch
            author: alice
            committer: bob
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: r1
              object_type: acme.widget
              op_type: create
              op_version: 1
              body: {}
            expect:
              reject: committer-mismatch
