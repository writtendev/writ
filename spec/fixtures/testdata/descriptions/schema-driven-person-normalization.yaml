name: schema-driven-person-normalization
description: >
  The highest-value fixture in this corpus: one schema declares value_type
  person-ref at every strategy position that normalizes it
  (spec/value-types.md §Normalization) -- lww value, create-once value,
  multi-value value, keyed-lww value, keyed-lww key column, set-union
  items, set-observed-remove items -- and at the one legal position that
  does not: append, which is neither a scalar nor one of the two named
  collection strategies NormalizesItems() covers. Every op writes a
  denormalized identifier (uppercase scheme, mixed-case value); the golden
  pins which fields come out normalized and which come out verbatim.
  create-once and multi-value normalizing here is a reducer fix
  (engine/internal/fold/strategy.go): before it, an unnormalized identifier
  under create-once would permanently beat a normalized one. tombstone and
  lattice are excluded: person-ref typechecks with neither (spec/fieldrules.go
  ValidateFieldRule), so they are covered by the rule-validation matrix
  (testdata/schema-rules/matrix.json) instead of here. (pins: reader)

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept

          - id: define-type
            parents: [create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
