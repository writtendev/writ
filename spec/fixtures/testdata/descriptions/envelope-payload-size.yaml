name: envelope-payload-size
description: >
  Reader-validation rule 1's size bound on op.json: exactly 1,048,576
  bytes (1 MiB) is accepted, 1,048,577 bytes is rejected as
  payload-too-large, and a normal op chained after the oversized one is
  itself accepted per this envelope family's own, per-commit verdicts
  (each described commit is decoded and checked directly, not reached by
  walking ancestry from a chain tip). Under the WRIT-289 reader-enumeration
  stopping rule, an actual reader walk starting at this chain's tip
  (payload-after-oversized) would hold that commit, then reject
  payload-over-max as payload-too-large and stop: payload-at-max, behind
  the break, is never reached and is held only if some other path of
  valid ops reaches it, which none does here.

refs:
  - name: refs/writ/0123456789abcdef/widget
    history:
      - commits:
          - id: payload-at-max
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: widget-01
              object_type: acme.widget
              op_type: create
              op_version: 1
              body: {}
            op_json_size: 1048576
            expect: accept
          - id: payload-over-max
            parents: [payload-at-max]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: widget-01
              object_type: acme.widget
              op_type: update
              op_version: 1
              body: {}
            op_json_size: 1048577
            expect:
              reject: payload-too-large
          - id: payload-after-oversized
            parents: [payload-over-max]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: widget-01
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "still fine"
            expect: accept

  # Rule 1's order of checks around the blob bound: tree shape, then the size
  # bound, then byte-equality. Each case below is oversized or at the bound
  # and wrong in one other way, so a reader that checks in another order
  # reports another reason. Padding here is not canonical (trailing spaces,
  # or a tree padded past one entry), so none of these can be accepted.
  - name: refs/writ/0123456789abcdef/gadget
    history:
      - commits:
          - id: noncanonical-at-max
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            message: "writ: create gadget/gadget-01\n"
            files:
              op.json: '{"body":{},"object_id":"gadget-01","object_type":"acme.gadget","op_type":"create","op_version":1}'
            op_json_size: 1048576
            expect:
              reject: non-canonical-payload
          - id: noncanonical-over-max
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            message: "writ: create gadget/gadget-01\n"
            files:
              op.json: '{"body":{},"object_id":"gadget-01","object_type":"acme.gadget","op_type":"create","op_version":1}'
            op_json_size: 1048577
            expect:
              reject: payload-too-large
          - id: extra-entry-over-max
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: gadget-01
              object_type: acme.gadget
              op_type: update
              op_version: 1
              body: {}
            op_json_size: 1048577
            tree_size: 100
            expect:
              reject: extra-tree-entry
          - id: executable-mode-over-max
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: gadget-01
              object_type: acme.gadget
              op_type: update
              op_version: 1
              body: {}
            op_json_size: 1048577
            tamper: op-json-mode-exec
            expect:
              reject: invalid-op-json-mode
