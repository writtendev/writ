name: envelope-payload-size
description: >
  Reader-validation rule 1's size bound on op.json: exactly 1,048,576
  bytes (1 MiB) is accepted, 1,048,577 bytes is rejected as
  payload-too-large, and a normal op chained after the oversized one is
  itself accepted per this envelope family's own, per-commit verdicts
  (each described commit is decoded and checked directly, not reached by
  walking ancestry from a chain tip). Under the WRIT-289 reader-enumeration
  stopping rule, an actual reader walk starting at this chain's tip would
  never reach payload-after-oversized at all: payload-over-max ends the
  walk, and the ops behind it — including this one — are held only if some
  other path of valid ops reaches them, which none does here.

refs:
  - name: refs/writ/0123456789abcdef/widget
    history:
      - commits:
          - id: payload-at-max
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: widget-01
              object_type: acme.widget
              op_type: create
              op_version: 1
              body: {}
            op_json_size: 1048576
            expect: accept
          - id: payload-over-max
            parents: [payload-at-max]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: widget-01
              object_type: acme.widget
              op_type: update
              op_version: 1
              body: {}
            op_json_size: 1048577
            expect:
              reject: payload-too-large
          - id: payload-after-oversized
            parents: [payload-over-max]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: widget-01
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "still fine"
            expect: accept
