name: schema-driven-ungrammatical-declaration
description: >
  WRIT-253: nothing on the read path checks a schema op's declared "type"
  or a schema object's own "namespace" against the object_type/namespace
  grammar before this ticket's resolver gate. codec.DecodeCommit only runs
  ValidateEnvelope, which bounds the wrapping op's own object_type
  ("schema") and op_type ("define-type"/"create"), never the strings
  carried inside the op body -- so a hand-crafted define-type (the same
  "non-conforming producer" scenario schema-driven-unqualified-declaration
  pins) is free to declare bytes that break out of a generated SQL string
  literal or a shell word once installed. This is a resolver rule, not a
  wire-grammar one: every op below decodes and folds into schema state
  exactly as written (expect: accept throughout), and only
  writ.RulesFromSchemas's grammar gate (validObjectTypeGrammar,
  validNamespaceGrammar) stands between a folded declaration and
  installation.

  One schema object, namespace "acme", declares a control ("acme.gadget",
  which installs and folds a real object normally) alongside five
  ungrammatical type names: a quote that breaks a SQL string literal
  ("acme.it's"), the ".lock" exclusion that is grammar-legal but
  ref-unwritable ("acme.lock"), an uppercase segment ("acme.Foo"), a
  second segment past the 64-character per-segment bound (65 "a"s), and a
  NUL byte that truncates generated SQL text at the C-string boundary
  ("acme.x\u0000y"). None of the five is reachable as a real object's own
  wire object_type -- that value IS checked by the ordinary envelope
  grammar on every op, hostile or not -- so only the declaration itself,
  and its own define-field, demonstrate the drop; there is no
  UnknownOp-shaped object to fold alongside acme.gadget's.

  A second schema object declares a namespace that is itself
  ungrammatical, "a') OR 1 --" (WRIT-253's own SQL-injection
  reproduction), and one type under it, "a') OR 1 --.z", with a tombstone
  field. Because the namespace fails its own grammar first, this is one
  conflict for the whole schema object, not one per type it declares
  (spec/schema-ops.md §6): every type an ungrammatical namespace declares
  is necessarily unqualifiable under it. Its object_id ("foreign-hostile-ns")
  deliberately does not carry the "schema:" prefix and is not derived
  from the namespace: the namespace contains a space, which
  spec/op-envelope.md's object_id grammar (printable, non-space ASCII)
  already refuses outright, so no derived id for it is even
  constructible -- WRIT-254 change 1 does not gate a non-derived id at
  all, so this object's create folds exactly as before, unaffected by
  this ticket, and the namespace-grammar conflict below is unchanged.

  acme.gadget's own ops fold normally throughout, unaffected by any of
  the six hostile declarations. (pins: reader)

