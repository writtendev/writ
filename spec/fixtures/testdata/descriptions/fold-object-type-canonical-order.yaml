name: fold-object-type-canonical-order
description: >
  An object whose earliest op in canonical total order is not named create,
  where a causally subsequent op with mismatched object_type is named create.
  Pins that an object's object_type is determined by the earliest op in
  canonical total order, distinguishing the ruled earliest-canonical-op rule
  from both the deleted create rung and slice-order dependence.

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: schema-create
            author: alice
            timestamp: 2025-12-01T00:00:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept

          - id: schema-define-widget
            parents: [schema-create]
            author: alice
            timestamp: 2025-12-01T00:01:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "acme.widget"
            expect: accept

          - id: schema-define-gadget
            parents: [schema-define-widget]
            author: alice
            timestamp: 2025-12-01T00:02:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "acme.gadget"
            expect: accept

          - id: schema-define-widget-open
            parents: [schema-define-gadget]
            author: alice
            timestamp: 2025-12-01T00:03:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "open"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: schema-define-widget-update
            parents: [schema-define-widget-open]
            author: alice
            timestamp: 2025-12-01T00:04:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "update"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: schema-define-gadget-create
            parents: [schema-define-widget-update]
            author: alice
            timestamp: 2025-12-01T00:05:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "create"
                op_version: "1"
                field: "body"
                value_type: "string"
                strategy: "lww"
            expect: accept

  - name: refs/writ/0123456789abcdef/widget
    history:
      - commits:
          - id: alice-open
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: widget-canonical-01
              object_type: acme.widget
              op_type: open
              op_version: 1
              body:
                title: "Initial Widget"
            expect: accept

          - id: alice-update
            parents: [alice-open]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: widget-canonical-01
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Updated Widget"
            expect: accept

  - name: refs/writ/fedcba9876543210/widget
    history:
      - commits:
          - id: bob-create
            parents: [alice-open]
            author: bob
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: widget-canonical-01
              object_type: acme.gadget
              op_type: create
              op_version: 1
              body:
                body: "mismatched type create op"
            expect: accept
