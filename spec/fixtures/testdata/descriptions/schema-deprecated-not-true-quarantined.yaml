name: schema-deprecated-not-true-quarantined
description: >
  spec/schema-ops.md §4.5/§4.6 (WRIT-338): a deprecate-type or deprecate-field
  op whose deprecated body field is not literally true -- false, any
  non-boolean, or absent -- is uninterpretable and MUST be reported through
  FoldSchema's UnknownOps, rather than silently clearing (or failing to set)
  a deprecation. acme.widget and its create/1/status field are deprecated
  with a conforming true op each, then five non-conforming ops in a row try
  to un-deprecate or corrupt the flag: false, a non-boolean string, another
  false, a non-boolean number, and (on a second, never-deprecated type,
  acme.gadget) a string "true" that is not the boolean literal. A final
  deprecate-field omits deprecated entirely. Every one of those quarantines,
  and neither widget nor status nor gadget's deprecation state moves.

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept

          - id: define-type-widget
            parents: [create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "acme.widget"
            expect: accept

          - id: define-type-gadget
            parents: [define-type-widget]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "acme.gadget"
            expect: accept

          - id: define-field-status
            parents: [define-type-gadget]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "create"
                op_version: "1"
                field: "status"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: deprecate-widget-true
            parents: [define-field-status]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: deprecate-type
              op_version: 1
              body:
                type: "acme.widget"
                deprecated: true
            expect: accept

          - id: deprecate-status-true
            parents: [deprecate-widget-true]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: deprecate-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "create"
                op_version: "1"
                field: "status"
                deprecated: true
            expect: accept

          - id: deprecate-widget-false
            parents: [deprecate-status-true]
            author: alice
            timestamp: 2026-01-01T00:06:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: deprecate-type
              op_version: 1
              body:
                type: "acme.widget"
                deprecated: false
            expect: accept

          - id: deprecate-widget-yes
            parents: [deprecate-widget-false]
            author: alice
            timestamp: 2026-01-01T00:07:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: deprecate-type
              op_version: 1
              body:
                type: "acme.widget"
                deprecated: "yes"
            expect: accept

          - id: deprecate-status-false
            parents: [deprecate-widget-yes]
            author: alice
            timestamp: 2026-01-01T00:08:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: deprecate-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "create"
                op_version: "1"
                field: "status"
                deprecated: false
            expect: accept

          - id: deprecate-status-one
            parents: [deprecate-status-false]
            author: alice
            timestamp: 2026-01-01T00:09:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: deprecate-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "create"
                op_version: "1"
                field: "status"
                deprecated: 1
            expect: accept

          - id: deprecate-gadget-string-true
            parents: [deprecate-status-one]
            author: alice
            timestamp: 2026-01-01T00:10:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: deprecate-type
              op_version: 1
              body:
                type: "acme.gadget"
                deprecated: "true"
            expect: accept

          - id: deprecate-status-omitted
            parents: [deprecate-gadget-string-true]
            author: alice
            timestamp: 2026-01-01T00:11:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: deprecate-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "create"
                op_version: "1"
                field: "status"
            expect: accept
