            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: define-field-verdict-v1
            parents: [define-field-title]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "approve"
                op_version: "1"
                field: "verdict"
                value_type: "enum"
                enum: ["approve", "block"]
                strategy: "keyed-lww"
                key: ["subject", "revision"]
                key_types:
                  subject: "person-ref"
                  revision: "string"
            expect: accept

          - id: define-field-verdict-v2
            parents: [define-field-verdict-v1]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.gadget"
                op_type: "approve"
                op_version: "2"
                field: "verdict"
                value_type: "enum"
                enum: ["approve", "block"]
                strategy: "keyed-lww"
                key: ["subject"]
                key_types:
                  subject: "person-ref"
            expect: accept

  - name: refs/writ/0123456789abcdef/gadget
    history:
      - commits:
          - id: create-1
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: gadget-1
              object_type: acme.gadget
              op_type: create
              op_version: 1
              body:
                title: "Widget"
