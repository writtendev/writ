name: forward-compat-unknown-ops
description: >
  Unknown object types, unknown op types under known object types, unknown
  top-level envelope fields, and unknown fields/structures inside body.
  Spread across alice and bob writer refs, all signed and valid envelopes (FC-1..FC-3).

refs:
  # The schema half of testdata/forward-compat/reader-profile.json, declared
  # in the repository's own log: widget's create v1 carries title and
  # description, widget's close v1 and gadget's post v1 and v2 carry no field
  # rules at all. The synthetic reader profile knows nothing about `schema`
  # itself, so these ops are opaque to it — writ's one hard-coded object type
  # is exactly the one a reader capability profile never has to declare.
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: schema-create
            author: alice
            timestamp: 2025-12-01T00:00:00Z
            disposition: opaque
            op:
              object_id: sch-acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept
          - id: schema-define-widget
            parents: [schema-create]
            author: alice
            timestamp: 2025-12-01T00:01:00Z
            disposition: opaque
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "widget"
            expect: accept
          - id: schema-define-gadget
            parents: [schema-define-widget]
            author: alice
            timestamp: 2025-12-01T00:02:00Z
            disposition: opaque
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "gadget"
            expect: accept
          - id: schema-define-title
            parents: [schema-define-gadget]
            author: alice
            timestamp: 2025-12-01T00:03:00Z
            disposition: opaque
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "widget"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept
          - id: schema-define-description
            parents: [schema-define-title]
            author: alice
            timestamp: 2025-12-01T00:04:00Z
            disposition: opaque
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "widget"
                op_type: "create"
                op_version: "1"
                field: "description"
                value_type: "string"
                strategy: "lww"
            expect: accept
          - id: schema-define-close
            parents: [schema-define-description]
            author: alice
            timestamp: 2025-12-01T00:05:00Z
            disposition: opaque
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-op
              op_version: 1
              body:
                type: "widget"
                op_type: "close"
                op_version: "1"
            expect: accept
          - id: schema-define-post-v1
            parents: [schema-define-close]
            author: alice
            timestamp: 2025-12-01T00:06:00Z
            disposition: opaque
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-op
              op_version: 1
              body:
                type: "gadget"
                op_type: "post"
                op_version: "1"
            expect: accept
          - id: schema-define-post-v2
            parents: [schema-define-post-v1]
            author: alice
            timestamp: 2025-12-01T00:07:00Z
            disposition: opaque
            op:
              object_id: sch-acme
              object_type: schema
              op_type: define-op
              op_version: 1
              body:
                type: "gadget"
                op_type: "post"
                op_version: "2"
            expect: accept

  - name: refs/writ/0123456789abcdef/widget
    history:
      - commits:
          - id: alice-known-with-top-level
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            disposition: interpretable
            op:
              object_id: widget-01
              object_type: widget
              op_type: create
              op_version: 1
              body:
                title: "Initial widget"
              client_info:
                build: 42
                name: "writ-web"
            expect: accept
          - id: alice-unknown-object
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            disposition: opaque
            op:
              object_id: telem-01
              object_type: telemetry
              op_type: emit
              op_version: 1
              body:
                metric: "latency_ms"
                value: 42
            expect: accept
          - id: alice-nested-body
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            disposition: interpretable
            op:
              object_id: widget-01
              object_type: gadget
              op_type: post
              op_version: 1
              body:
                text: "Looks good"
                metadata:
                  flags:
                    - "automated"
                    - "experimental"
                  scores:
                    confidence: 0.95
            expect: accept

  - name: refs/writ/fedcba9876543210/widget
    history:
      - commits:
          - id: bob-unknown-op-type
            author: bob
            timestamp: 2026-01-01T00:00:30Z
            disposition: opaque
            op:
              object_id: widget-01
              object_type: widget
              op_type: archive
              op_version: 1
              body:
                reason: "superseded"
            expect: accept
          - id: bob-unknown-body-field
            parents: [bob-unknown-op-type, alice-nested-body]
            author: bob
            timestamp: 2026-01-01T00:03:00Z
            disposition: interpretable
            op:
              object_id: widget-01
              object_type: widget
              op_type: close
              op_version: 1
              body:
                reason: "resolved"
                draft_note: "final note"
            expect: accept
