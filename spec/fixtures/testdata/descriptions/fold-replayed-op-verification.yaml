name: fold-replayed-op-verification
description: >
  An op's verification outcome across its carriers (WRIT-312,
  spec/signing.md §Op Identity, "Verification across carriers"). Carriers
  of one signed payload share its bytes but not their signature headers,
  so their own outcomes can differ, and the op's outcome is the best of
  them under the WRIT-251 trust order, valid > wrong-key > unsigned >
  corrupted-signature > payload-mutated, ties broken by the smallest
  carrier SHA, not the surviving (lowest-SHA) carrier's own.

  Alice's `revision` op has three carriers (valid, unsigned,
  corrupted-signature; the unsigned one lowest). Each adjacent pair of the
  trust order is then pinned by its own `update` op with exactly that pair
  of carriers, the less trusted one at the lower SHA, in trust order:
  valid over wrong-key (Bob's op, a carrier signed with Alice's key),
  wrong-key over unsigned, unsigned over corrupted-signature, and
  corrupted-signature over payload-mutated, whose payload-mutated carrier
  is a real SSHSIG by Alice's key over another commit's payload
  (tamper: signature-transplant). A reader that swaps any one adjacent
  pair gets that pair's op wrong; one that reports the lowest-SHA
  carrier's own outcome gets all of them wrong.

  The tie-break is pinned for the three outcomes that report a key
  fingerprint, by one op each whose two carriers share the outcome and
  are signed by different keys: valid (the trust store binds Bob's key to
  Alice's address as well as Alice's), wrong-key (an author address that
  matches no trust-store rule, signed by Alice's key and by Bob's), and
  payload-mutated (a transplanted signature under each key). The golden
  records the key fingerprint of the smallest-SHA carrier, and the ties
  are arranged so it is Alice's in two and Bob's in one, so a reader that
  prefers the highest SHA, or a particular key or ref name, gets one
  wrong. Unsigned and corrupted-signature carriers carry no key, so a tie
  between them reports nothing a reader could get wrong and is not
  pinned.

  The fold golden records the op-level `verification` and
  `key_fingerprint` for every op with more than one carrier. The fold
  fixture test asserts each carrier's declared `expect.verification`, that
  in every op whose carriers disagree the lowest-SHA carrier is less
  trusted than the best, that every adjacent pair and every key-carrying
  tie has an op, and that each tie's carriers carry different keys, so the
  fixture cannot silently stop telling those readers apart.

# Alice's and Bob's keys each bind to their own address, and Bob's key to
# Alice's address too, which is what makes a second valid key for one author
# (the valid tie) possible. Alice's key is not bound to Bob's address, nor
# either key to Alice@Example.TEST, which is how the wrong-key carriers arise.
trust_store:
  - principals: ["alice@example.test"]
    key: alice
  - principals: ["bob@example.test"]
    key: bob
  - principals: ["alice@example.test"]
    key: bob

refs:
  - name: refs/writ/0123456789abcdef/schema
    history:
      - commits:
          - id: schema-create
            author: alice
            timestamp: 2025-12-01T00:00:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: create
              op_version: 1
              body:
                namespace: "acme"
            expect: accept

          - id: schema-define-type
            parents: [schema-create]
            author: alice
            timestamp: 2025-12-01T00:01:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-type
              op_version: 1
              body:
                type: "acme.widget"
            expect: accept

          - id: schema-define-create-title
            parents: [schema-define-type]
            author: alice
            timestamp: 2025-12-01T00:02:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "create"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: schema-define-update-title
            parents: [schema-define-create-title]
            author: alice
            timestamp: 2025-12-01T00:03:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "update"
                op_version: "1"
                field: "title"
                value_type: "string"
                strategy: "lww"
            expect: accept

          - id: schema-define-revision-base
            parents: [schema-define-update-title]
            author: alice
            timestamp: 2025-12-01T00:04:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "revision"
                op_version: "1"
                field: "base"
                value_type: "git-oid"
                strategy: "append"
            expect: accept

          - id: schema-define-revision-head
            parents: [schema-define-revision-base]
            author: alice
            timestamp: 2025-12-01T00:05:00Z
            op:
              object_id: schema:acme
              object_type: schema
              op_type: define-field
              op_version: 1
              body:
                type: "acme.widget"
                op_type: "revision"
                op_version: "1"
                field: "head"
                value_type: "git-oid"
                strategy: "append"
            expect: accept

  - name: refs/writ/0123456789abcdef/widget
    history:
      - commits:
          - id: widget-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: create
              op_version: 1
              body:
                title: "Initial Title"
            expect: accept

          - id: widget-revision
            parents: [widget-create]
            author: alice
            timestamp: 2026-01-01T00:10:00Z
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: revision
              op_version: 1
              body:
                base: "0123456789abcdef0123456789abcdef01234567"
                head: "89abcdef0123456789abcdef0123456789abcde2"
            expect: accept

  # The same declaration of the revision with no signature header at all:
  # the same signed bytes, so the same op, but nothing signed them.
  - name: refs/writ/fedcba9876543210/widget
    history:
      - commits:
          - id: widget-revision-unsigned
            parents: [widget-create]
            author: alice
            timestamp: 2026-01-01T00:10:00Z
            unsigned: true
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: revision
              op_version: 1
              body:
                base: "0123456789abcdef0123456789abcdef01234567"
                head: "89abcdef0123456789abcdef0123456789abcde2"
            expect:
              accept: true
              verification: unsigned

  # ... and with its signature header's armor corrupted.
  - name: refs/writ/2222222222222222/widget
    history:
      - commits:
          - id: widget-revision-corrupted
            parents: [widget-create]
            author: alice
            timestamp: 2026-01-01T00:10:00Z
            tamper: signature
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: revision
              op_version: 1
              body:
                base: "0123456789abcdef0123456789abcdef01234567"
                head: "89abcdef0123456789abcdef0123456789abcde2"
            expect:
              accept: true
              verification: corrupted-signature


  # Valid over wrong-key. Bob's op: one carrier is signed with Bob's key, the
  # other with Alice's, which no trust-store rule binds to Bob's address.
  - name: refs/writ/5000000000000001/widget
    history:
      - commits:
          - id: update-valid-over-wrong-key-valid
            parents: [widget-revision]
            author: bob
            timestamp: 2026-01-01T00:20:00Z
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Valid over wrong-key v74"
            expect: accept
  - name: refs/writ/5000000000000002/widget
    history:
      - commits:
          - id: update-valid-over-wrong-key-wrong
            parents: [widget-revision]
            author: bob
            timestamp: 2026-01-01T00:20:00Z
            sign_as: alice
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Valid over wrong-key v74"
            expect:
              accept: true
              verification: wrong-key

  # Wrong-key over unsigned: no carrier is valid, so the op reads wrong-key,
  # under Alice's key, not unsigned.
  - name: refs/writ/6000000000000001/widget
    history:
      - commits:
          - id: update-wrong-key-over-unsigned-wrong
            parents: [widget-revision]
            author: bob
            timestamp: 2026-01-01T00:25:00Z
            sign_as: alice
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Wrong-key over unsigned"
            expect:
              accept: true
              verification: wrong-key
  - name: refs/writ/6000000000000002/widget
    history:
      - commits:
          - id: update-wrong-key-over-unsigned-unsigned
            parents: [widget-revision]
            author: bob
            timestamp: 2026-01-01T00:25:00Z
            unsigned: true
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Wrong-key over unsigned"
            expect:
              accept: true
              verification: unsigned

  # Unsigned over corrupted-signature.
  - name: refs/writ/7000000000000001/widget
    history:
      - commits:
          - id: update-unsigned-over-corrupted-unsigned
            parents: [widget-revision]
            author: alice
            timestamp: 2026-01-01T00:30:00Z
            unsigned: true
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Unsigned over corrupted v5"
            expect:
              accept: true
              verification: unsigned
  - name: refs/writ/7000000000000002/widget
    history:
      - commits:
          - id: update-unsigned-over-corrupted-corrupted
            parents: [widget-revision]
            author: alice
            timestamp: 2026-01-01T00:30:00Z
            tamper: signature
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Unsigned over corrupted v5"
            expect:
              accept: true
              verification: corrupted-signature

  # Corrupted-signature over payload-mutated: the transplanted carrier holds
  # a real SSHSIG by Alice's key over another commit's payload.
  - name: refs/writ/8000000000000001/widget
    history:
      - commits:
          - id: update-corrupted-over-mutated-corrupted
            parents: [widget-revision]
            author: alice
            timestamp: 2026-01-01T00:35:00Z
            tamper: signature
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Corrupted over mutated v55"
            expect:
              accept: true
              verification: corrupted-signature
  - name: refs/writ/8000000000000002/widget
    history:
      - commits:
          - id: update-corrupted-over-mutated-mutated
            parents: [widget-revision]
            author: alice
            timestamp: 2026-01-01T00:35:00Z
            tamper: signature-transplant
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Corrupted over mutated v55"
            expect:
              accept: true
              verification: payload-mutated

  # Tie, valid: two valid carriers under different keys (the third trust-store
  # rule makes Bob's key valid for Alice's address as well).
  - name: refs/writ/9000000000000001/widget
    history:
      - commits:
          - id: update-tie-valid-alice
            parents: [widget-revision]
            author: alice
            timestamp: 2026-01-01T00:40:00Z
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Tie valid v8"
            expect: accept
  - name: refs/writ/9000000000000002/widget
    history:
      - commits:
          - id: update-tie-valid-bob
            parents: [widget-revision]
            author: alice
            timestamp: 2026-01-01T00:40:00Z
            sign_as: bob
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Tie valid v8"
            expect: accept

  # Tie, wrong-key: no trust-store rule matches the case-mismatched address,
  # so Alice's key and Bob's are both wrong-key.
  - name: refs/writ/a000000000000001/widget
    history:
      - commits:
          - id: update-tie-wrong-key-alice
            parents: [widget-revision]
            author: alice_upper
            timestamp: 2026-01-01T00:45:00Z
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Tie wrong-key"
            expect:
              accept: true
              verification: wrong-key
  - name: refs/writ/a000000000000002/widget
    history:
      - commits:
          - id: update-tie-wrong-key-bob
            parents: [widget-revision]
            author: alice_upper
            timestamp: 2026-01-01T00:45:00Z
            sign_as: bob
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Tie wrong-key"
            expect:
              accept: true
              verification: wrong-key

  # Tie, payload-mutated: a transplanted signature under each key.
  - name: refs/writ/b000000000000001/widget
    history:
      - commits:
          - id: update-tie-mutated-alice
            parents: [widget-revision]
            author: alice
            timestamp: 2026-01-01T00:50:00Z
            tamper: signature-transplant
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Tie mutated v98"
            expect:
              accept: true
              verification: payload-mutated
  - name: refs/writ/b000000000000002/widget
    history:
      - commits:
          - id: update-tie-mutated-bob
            parents: [widget-revision]
            author: alice
            timestamp: 2026-01-01T00:50:00Z
            tamper: signature-transplant
            sign_as: bob
            op:
              object_id: w-carrier-verification
              object_type: acme.widget
              op_type: update
              op_version: 1
              body:
                title: "Tie mutated v98"
            expect:
              accept: true
              verification: payload-mutated
