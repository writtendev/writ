name: schema-driven-unrecognized-value-type
description: >
  WRIT-334's Option A ruling made executable: a define-field whose value_type,
  or a key_types entry, is outside this reader's spec.KnownValueTypes is
  demoted -- installed untyped at exactly that position, still folds, still
  reports a warning-shaped SchemaConflict -- rather than withheld the way
  spec.ValidateFieldRule's other violations are (schema-driven-invalid-rule.yaml).
  acme.widget carries a control field (title, ordinary string) and six
  demoted ones. ident (x-uuid, lww) is deliberately the sole rule of its
  own op_type (set-ident) -- before this ticket, dropping that rule dropped
  the whole op to UnknownOp, which this fixture's golden now shows folding
  normally instead; size (x-duration, lww, paired with max_length) and
  grade (x-rating, lww, paired with enum) exercise the same demotion with
  the two field-rule attributes spec.ValidateFieldRule would otherwise
  cross-check against a known value_type, and both attributes are preserved
  on the resolved rule regardless -- the fold never reads either one.
  Per-position demotion (the orchestrator's decision on WRIT-334's plan,
  pending Matt's confirmation before the tag) is pinned in both directions:
  score (keyed-lww, value_type person-ref, key(who), key_types
  {who: x-handle}) has a recognized value_type beside an unrecognized
  key_types entry, so only "who" demotes and score's own value keeps
  normalizing as person-ref; owner (keyed-lww, value_type x-owner-kind,
  key(holder), key_types {holder: person-ref}) is the reverse -- an
  unrecognized value_type beside a recognized key_types entry, so "holder"
  keeps normalizing as person-ref while owner's own value is installed
  untyped. assignment (keyed-lww, value_type string, key(assignee, team),
  key_types {assignee: person-ref, team: x-team-kind}) covers sibling key
  columns of mixed recognized/unrecognized type on the same rule: assignee
  normalizes, team does not. All four keyed-lww fields are written with a
  mixed-case value on every person-ref-typed position so the golden's
  normalized/verbatim split is visible rather than merely asserted.

  acme.gadget, a second type in the same schema object, pins the negative
  the demotion goldens above cannot: passes 2 and 3 compare raw declared
  types, never demoted ones, so two rules that disagree on their raw,
  otherwise-unrecognized type still withhold instead of wrongly agreeing
  as "untyped" (engine/schema_test.go's
  TestRulesFromSchemas_SharedTargetDifferentUnrecognizedTypesWithheldNoWarning
  pins this at the resolver level; nothing previously pinned it at the
  log-resolved level a schema-driven fold actually walks, or covered the
  key-column pass at all). mark-a and mark-b both declare field "tag" with
  no target, so both bind target "tag" (spec.FieldRule.TargetKey); they
  are different op_types, so no version-bump carve-out applies, and their
  raw value_types (x-mark-a vs x-mark-b) disagree -- CheckTargetAgreement
  withholds both, and the mark-a-1/mark-b-1 ops fall to UnknownOp with no
  demotion warning at all. note_a and note_b, one op_type "audit", both
  bind key column "case" with disagreeing raw key_types entries
  (x-case-a vs x-case-b) -- CheckKeyColumnAgreement withholds both the
  same way, and the audit-1 op, which writes both fields at once, falls to
  UnknownOp too.

  The golden pins six warnings (one per demoted field on acme.widget, none
  for the control), two withhold conflicts (acme.gadget's target and key-
  column collisions) and no drop conflicts; every acme.widget field present
  in folded state; and unknown_ops holding exactly mark-a-1, mark-b-1, and
  audit-1 -- never set-ident's op, which is the ticket's own repro of the
  single-rule-op_type case folding normally instead of falling to
  UnknownOp. (pins: reader)

