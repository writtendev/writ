name: schema-driven-unrecognized-value-type
description: >
  WRIT-334's Option A ruling made executable: a define-field whose value_type,
  or a key_types entry, is outside this reader's spec.KnownValueTypes is
  demoted -- installed untyped at exactly that position, still folds, still
  reports a warning-shaped SchemaConflict -- rather than withheld the way
  spec.ValidateFieldRule's other violations are (schema-driven-invalid-rule.yaml).
  One control field (title, ordinary string) and four demoted ones: ident
  (x-uuid, lww) is deliberately the sole rule of its own op_type
  (set-ident) -- before this ticket, dropping that rule dropped the whole
  op to UnknownOp, which this fixture's golden now shows folding normally
  instead; size (x-duration, lww, paired with max_length) and grade
  (x-rating, lww, paired with enum) exercise the same demotion with the
  two field-rule attributes spec.ValidateFieldRule would otherwise
  cross-check against a known value_type, and both attributes are preserved
  on the resolved rule regardless -- the fold never reads either one. score
  (keyed-lww, value_type person-ref, key(who), key_types {who: x-handle})
  is the decisive case: value_type is a recognized catalogue member and
  key_types' one entry is not, so per-position demotion (Matt's ruling via
  the orchestrator decision comment on WRIT-334) clears only the key_types
  entry -- score's own value keeps normalizing as person-ref while its
  "who" key component does not, written here with a mixed-case value on
  each so the golden's normalized/verbatim split is visible rather than
  merely asserted. The golden pins four warnings (one per demoted field,
  none for the control), no drop conflicts, every field present in folded
  state, and an empty unknown_ops -- including for set-ident's op, which
  is the ticket's own repro of the single-rule-op_type case. (pins: reader)

refs:
