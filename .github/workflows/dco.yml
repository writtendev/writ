name: DCO

on:
  pull_request:
    branches: [main]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          commits=$(git rev-list --no-merges "$merge_base..$HEAD_SHA")
          missing=0
          for sha in $commits; do
            author_email=$(git log -1 --format='%ae' "$sha")
            if ! git log -1 --format='%B' "$sha" | grep -E -qi '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $sha has no Signed-off-by trailer (see CONTRIBUTING.md)"
              missing=1
            elif ! git log -1 --format='%B' "$sha" | grep -i '^Signed-off-by:' | grep -i -q -F "<$author_email>"; then
              echo "::error::commit $sha Signed-off-by trailer does not match author email <$author_email> (see CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit "$missing"
