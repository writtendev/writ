name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./...

  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test -race ./...

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make fuzz FUZZTIME=20s

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make api-check

  # api-check answers "is the baseline current". This answers "did anything
  # break", which the text listing cannot: an added interface method, a
  # constant inserted into an iota block, and a non-comparable field added to
  # a comparable struct all reach it as plain added lines — the last of them
  # as no line at all when the field is unexported. It needs a base revision
  # to compare against, so it runs on pull requests only; a push to main has
  # no meaningful base and the job is skipped.
  #
  # It prints every engine change and fails on one thing: an incompatible
  # change that CHANGELOG.md does not mention. Before 1.0 breaking changes are
  # allowed, silent ones are not, and the CHANGELOG entry is the
  # acknowledgement CONTRIBUTING.md already asks for — so the way through needs
  # no baseline, no label, and no write permissions here.
  #
  # It is a separate job from `api` deliberately: fetching apidiff is a network
  # call, and the staleness gate must not depend on one.
  api-compat:
    name: api-compat
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Classify the API delta against the merge base
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          out="$RUNNER_TEMP/api-compat.txt"
          # A breaking change without a CHANGELOG.md entry fails the job. The
          # report is the reason for the failure, so it has to reach the log
          # and the summary either way.
          status=0
          make api-compat BASE="origin/$GITHUB_BASE_REF" > "$out" 2>&1 || status=$?
          cat "$out"
          { echo '```'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make cli-docs-check


  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: golangci-lint-goinstall-v1.64.8-${{ runner.os }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m
